local_conf_header:
  kas: |
    PACKAGE_CLASSES ?= "package_ipk"
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
    USER_CLASSES ?= "buildstats"
    OE_TERMINAL ?= "tmux"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
    CONF_VERSION = "2"
    BUILDHISTORY_FEATURES ?= ""
    # To use 'firmware-imx' you need to accept the Freescale EULA
    ACCEPT_FSL_EULA = "1"
    # add "ptest" to our DISTRO_FEATURES variable causes -ptest packages to be built.
    DISTRO_FEATURES:append = " ptest"
    # Disable qt ptest to avoid build problems with Yocto scarthgap release.
    QT_PTEST_ENABLED = "0"

distro: hipos

machine: himx0294

target: hipos-prodimage

